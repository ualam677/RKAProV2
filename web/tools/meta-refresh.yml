# The Meta screen's weekly refresh. GitHub only runs schedules from the default branch, so this one file lives on
# master as .github/workflows/meta-refresh.yml. Each day it starts the deploy ("Deploy web app") on the branch the
# site was last deployed from; that deploy fetches new Meta data only when its copy is a week old or the TCG ban list
# changed, and otherwise skips publishing. Nothing else on master is needed.
name: Meta refresh
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  actions: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Start the deploy on the live branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch=$(gh run list --workflow web.yml --status success --limit 1 --json headBranch --jq '.[0].headBranch')
          echo "The site was last deployed from: $branch"
          gh workflow run web.yml --ref "$branch" -f scheduled=true
