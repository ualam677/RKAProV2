# The only workflow that runs on push; the desktop and Android builds are started by hand.
name: Deploy web app
on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  # started by hand, or each day by the small "meta-poke" workflow on master (scheduled: true), which redeploys only
  # when the Meta data is a week old or the TCG ban list changed
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Started by the daily check: deploy only if the Meta data was refreshed"
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # a daily check never cancels a deploy that's running
  cancel-in-progress: ${{ !inputs.scheduled }}
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json
    # the Meta screen's data (yugiohmeta.com): kept while under a week old and the ban list is unchanged; never fails
    - name: Meta data
      id: meta
      continue-on-error: true
      env:
        LIVE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/meta.json
      run: node web/tools/fetch-meta.mjs
    - name: Build
      if: ${{ !inputs.scheduled || steps.meta.outputs.fresh == 'true' }}
      working-directory: web
      env:
        # Google Drive sync: the site's Google sign-in ID (a repository variable; empty until set up, see web/README.md)
        VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      run: |
        npm ci
        npm run build
    - if: ${{ !inputs.scheduled || steps.meta.outputs.fresh == 'true' }}
      uses: actions/configure-pages@v5
    - if: ${{ !inputs.scheduled || steps.meta.outputs.fresh == 'true' }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: web/dist
    - id: deployment
      if: ${{ !inputs.scheduled || steps.meta.outputs.fresh == 'true' }}
      uses: actions/deploy-pages@v4
